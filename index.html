원칙:
- 사용자의 생활 패턴에 맞춰 실제로 실천할 수 있는 제안을 해.
- 기록과 인바디를 근거로 구체적인 숫자를 들어 말해. 기록이 없는 부분은 지어내지 말고 없다고 말해.
- 인바디는 측정 조건(식사, 수분, 시간)에 따라 오차가 있으니 한 번의 변화보다 여러 번의 추세로 판단하고, 판정제외 표시된 측정은 근손실·지방 증가 판단에 쓰지 마.
- 운동을 추천할 때는 종목별 최근 기록을 근거로 중량 × 횟수 × 세트와 RIR을 구체적으로 제시하고, 목표 횟수를 모두 채우면 중량을 올리는 식으로 점진적으로 안내해. 사용자가 세트 기록을 알려 주면 이전 기록과 비교해 평가해.
- 평소 상태(참고용)는 사용자가 지금까지 해 온 방식이야. 수준 파악에만 쓰고, 계획과 조언은 너의 판단으로 새로 세워. 사용자가 직접 정한 규칙이 있으면 존중해.
- 운동 프로그램이 있으면 그 프로그램을 기준으로 조언하고, 바꿔야 할 이유가 있으면 근거를 들어 제안해.

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:600}
.stat .s{font-size:12px;color:var(--muted)}
.chart{background:var(--surface);border-radius:16px;padding:12px 0 6px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);padding:0 16px 6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.lift{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:none}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.composer{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));left:0;right:0;background:var(--paper);padding:8px 12px;z-index:20;border-top:1px solid var(--line)}
.composer-in{max-width:520px;margin:0 auto;display:flex;gap:8px}
.hint{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -6px 16px}
.wk{border:none;background:transparent;color:#fff;border-radius:10px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.wk[aria-pressed="true"]{background:rgba(255,255,255,.15)}
.wk-d{font-size:11px;color:rgba(255,255,255,.62)}
.wk-bar{width:8px;height:32px;border-radius:4px;background:rgba(255,255,255,.12);display:flex;align-items:flex-end;overflow:hidden}
.wk-bar i{display:block;width:100%;border-radius:4px}
.wk-n{font-size:13px;font-weight:600}
.wk-dot{width:4px;height:4px;border-radius:50%;background:#fff}
.btn-sm{padding:9px 12px;font-size:14px}
.portions{list-style:none;margin:6px 0 4px;padding:0}
.portions li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px}
.portions .portion{color:var(--muted);text-align:right}
.portions li.skip span:first-child{text-decoration:line-through;color:var(--muted)}
.plan-meal{font-size:12px;color:var(--p);font-weight:600;margin-bottom:2px}
.busy-line{display:flex;align-items:center;gap:6px}
.report{background:#fff;border-radius:16px;padding:14px 16px}
.report-date{font-size:13px;color:var(--muted);margin-bottom:6px}
.report-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px}
.banners{display:grid;gap:8px}
.banner{width:100%;text-align:left;border:none;background:var(--ink2);color:#fff;border-radius:14px;padding:12px 14px;cursor:pointer}
.banner b{display:block;font-size:14px;font-weight:600}
.banner span{display:block;font-size:13px;color:rgba(255,255,255,.72);margin-top:2px}
.older>summary{cursor:pointer;color:var(--p);font-weight:500;padding:6px 2px}
.older details{background:#fff;border-radius:12px;padding:10px 14px;margin-top:8px}
.older details summary{cursor:pointer;font-size:14px}
.menu-line{font-size:14px;padding:3px 0}
.menu-line b{font-weight:600;margin-right:8px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthbar .m{font-size:18px;font-weight:700}
.round-l{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;cursor:pointer}
.round-l:disabled{opacity:.4}
.files{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.file{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:10px;padding:4px 2px 4px 4px;font-size:12px}
.file img{width:36px;height:36px;object-fit:cover;border-radius:6px}
.file-name{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn-note{font-size:13px;color:var(--warn);margin:6px 0}
.chip:disabled{opacity:.5}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:12px 0 4px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;flex-shrink:0}
.diag{list-style:none;margin:12px 0 6px;padding:0;font-size:14px}
.diag li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.diag li:last-child{border-bottom:none}
.diag span{color:var(--muted)}
.diag b.bad{color:var(--warn)}
.sync-chip{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:12.5px;word-break:break-all}
.sync-help{margin-top:10px;font-size:13px}
.sync-help summary{cursor:pointer;color:var(--p);font-weight:500;padding:4px 0}
.sync-help ol{margin:8px 0;padding-left:20px}
.sync-help li{margin-bottom:6px}
.sync-help a{color:var(--p)}
.sql{background:var(--ink);color:#D9E4F5;font-size:12px;line-height:1.6;padding:12px;border-radius:10px;overflow-x:auto;white-space:pre;margin:6px 0 10px;font-family:ui-monospace,Menlo,Consolas,monospace}
.ctick{font-size:10px;fill:#617085;font-family:inherit}
.chart{padding:12px 10px 8px}
.chart .legend{padding:0 6px 6px}
.chart-cap{font-size:12px;color:var(--muted);padding:2px 6px 0;min-height:18px}
.plan-items{margin:6px 0 4px;padding-left:18px;font-size:14px}
.plan-items li{padding:2px 0}
.sess{list-style:none;margin:4px 0;padding:0}
.sess li{padding:7px 0;border-bottom:1px dashed var(--line)}
.sess li:last-child{border-bottom:none}
.parsed{list-style:none;margin:10px 0 0;padding:0}
.parsed li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:7px 10px;background:var(--paper);border-radius:10px;margin-bottom:6px}
.parsed .pname{font-weight:600;font-size:14px}
.parsed .pdetail{font-size:14px;color:var(--p)}
.parsed .pvol{font-size:12px;color:var(--muted);margin-left:auto}
.sess .t{font-weight:600;font-size:15px}
.sess .g{color:var(--p);font-size:14px}
.pday{border-top:1px solid var(--line);padding:8px 0}
.pday summary{cursor:pointer;font-size:14px}
.pday summary b{display:inline-block;width:24px;color:var(--p)}
.banner.warn{background:var(--warn)}
.guide-help{font-size:13px;color:var(--muted);margin:6px 0 0}
.gtotal{font-size:12px;color:var(--muted);text-align:right}
.gitem{padding:9px 0;border-bottom:1px dashed var(--line)}
.gitem:last-child{border-bottom:none}
.gitem-top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.gname{font-weight:500;min-width:0;overflow-wrap:anywhere}
.gkcal{font-size:14px;white-space:nowrap}
.gitem.off .gname,.gitem.off .gkcal{color:var(--muted)}
.gitem.off .gname{text-decoration:line-through}
.gitem-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.stepper{display:flex;align-items:center;background:var(--paper);border-radius:999px;flex-shrink:0}
.stepper button{width:40px;height:36px;border:none;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--ink);border-radius:999px}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper span{min-width:66px;text-align:center;font-size:13px;font-weight:600}
.stepper span.moved{color:var(--p)}
.item-btn{display:block;text-align:left;border:none;background:transparent;padding:0;cursor:pointer;min-width:0}
.item-btn .item-name{display:block}
.item-btn .inline-macros{display:flex}
.save-status{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin:18px 0 0}
.form-block .save-status{justify-content:flex-start;margin:0 0 8px}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:#2E8C62;flex-shrink:0}
.save-status.bad{color:var(--warn)}
.save-status.warn{color:var(--c)}
.save-status.warn .dot{background:var(--c)}
.save-status.bad .dot{background:var(--warn)}
